services:
  postgres:
    image: postgres:16-alpine
    container_name: sa-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: socialautomation_prod
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d socialautomation_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sa-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_prod_data:/data

  api:
    build:
      context: .
      dockerfile: src/SocialAutomation.Api/Dockerfile
    container_name: sa-api-prod
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=socialautomation_prod;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Prefer;"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "SocialAutomation"
      Jwt__Audience: "SocialAutomation"
      Instagram__AppId: "${INSTAGRAM_APP_ID}"
      Instagram__AppSecret: "${INSTAGRAM_APP_SECRET}"
      Instagram__WebhookVerifyToken: "${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}"
      AI__ApiKey: "${OPENAI_API_KEY}"
      App__AllowedOrigins: "https://socialautomation.ademartognasca.com.br;http://localhost:3100;http://localhost:3101"
    ports:
      - "127.0.0.1:5010:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/SocialAutomation.Worker/Dockerfile
    container_name: sa-worker-prod
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=socialautomation_prod;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Prefer;"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Instagram__AppId: "${INSTAGRAM_APP_ID}"
      Instagram__AppSecret: "${INSTAGRAM_APP_SECRET}"
      AI__ApiKey: "${OPENAI_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/socialautomation-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api-socialautomation.ademartognasca.com.br"
    container_name: sa-frontend-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "https://api-socialautomation.ademartognasca.com.br"
      PORT: "3100"
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - api


volumes:
  postgres_prod_data:
  redis_prod_data: